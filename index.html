<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <title>Charleston Training</title>
    <script>
      try {
        if (localStorage.getItem('chartrain-dark-mode') === '1') document.documentElement.classList.add('dark-mode');
      } catch (_) {}
    </script>
    <!--
      Sentinel Boot-Guard (CHARTRAIN_SENTINEL_MEDIC.md §4.1)
      Runs BEFORE the bundle loads. Catches site-load failures the bundled
      error reporter structurally cannot (the reporter lives inside the bundle
      that failed). ES5-safe — no imports, no JSX, no module syntax.
        - catches window.onerror, unhandledrejection, vite:preloadError
        - on a transient chunk/preload failure: auto-reloads ONCE per 30s
        - otherwise: renders a minimal fallback UI with a Try-again button
        - stashes every caught error to localStorage key 'ct_boot_errors',
          drained into the clientErrors collection on next successful app init.
    -->
    <script>
      (function () {
        'use strict';
        var STORE_KEY = 'ct_boot_errors';
        var RELOAD_KEY = 'ct_boot_reload_at';
        var RELOAD_WINDOW_MS = 30000;
        var MAX_STASHED = 25;

        function nowIso() {
          try { return new Date().toISOString(); } catch (_) { return ''; }
        }

        function stash(record) {
          try {
            var raw = localStorage.getItem(STORE_KEY);
            var list = raw ? JSON.parse(raw) : [];
            if (!list || typeof list.length !== 'number') list = [];
            list.push(record);
            if (list.length > MAX_STASHED) list = list.slice(list.length - MAX_STASHED);
            localStorage.setItem(STORE_KEY, JSON.stringify(list));
          } catch (_) {}
        }

        function isTransientLoadError(message, source) {
          var hay = String(message || '') + ' ' + String(source || '');
          return /Failed to fetch dynamically imported module|Loading chunk|Loading CSS chunk|error loading dynamically imported module|Importing a module script failed|preload|ChunkLoadError|Unexpected token '<'/i.test(hay);
        }

        function canAutoReload() {
          try {
            var last = parseInt(sessionStorage.getItem(RELOAD_KEY) || '0', 10);
            if (last && (Date.now() - last) < RELOAD_WINDOW_MS) return false;
            sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
            return true;
          } catch (_) {
            // No sessionStorage — do not risk an infinite reload loop.
            return false;
          }
        }

        var fallbackRendered = false;
        function renderFallback() {
          if (fallbackRendered) return;
          fallbackRendered = true;
          try {
            var root = document.getElementById('root');
            if (!root) return;
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
              'padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;' +
              'background:#7f1d1d;color:#fff;">' +
              '<div>' +
              '<div style="font-size:40px;margin-bottom:12px;">&#9888;</div>' +
              '<h1 style="font-size:18px;font-weight:700;margin:0 0 8px;">Couldn\'t load &mdash; retrying</h1>' +
              '<p style="font-size:14px;opacity:.9;margin:0 0 18px;">' +
              'Charleston Training had trouble loading. This is usually a network hiccup.</p>' +
              '<button type="button" id="ct-boot-retry" ' +
              'style="background:#fff;color:#7f1d1d;border:none;padding:12px 32px;border-radius:12px;' +
              'font-size:15px;font-weight:700;cursor:pointer;">Try again</button>' +
              '</div></div>';
            var btn = document.getElementById('ct-boot-retry');
            if (btn) {
              btn.onclick = function () {
                try { sessionStorage.removeItem(RELOAD_KEY); } catch (_) {}
                window.location.reload();
              };
            }
          } catch (_) {}
        }

        function handle(kind, message, source, stack) {
          stash({
            kind: kind,
            message: String(message || 'Unknown boot error').slice(0, 1000),
            source: String(source || '').slice(0, 500),
            stack: String(stack || '').slice(0, 1500),
            url: (window.location && window.location.pathname) || '',
            userAgent: (navigator && navigator.userAgent ? navigator.userAgent : '').slice(0, 200),
            at: nowIso()
          });
          if (isTransientLoadError(message, source)) {
            if (canAutoReload()) {
              window.location.reload();
            } else {
              renderFallback();
            }
          } else {
            // Non-transient: leave the bundle a chance to mount its own UI.
            // The React error boundary handles in-app crashes; only show the
            // boot fallback if nothing ever mounted.
            setTimeout(function () {
              try {
                var root = document.getElementById('root');
                if (root && root.childElementCount === 0) renderFallback();
              } catch (_) {}
            }, 4000);
          }
        }

        window.addEventListener('error', function (e) {
          // Resource load errors (script/link/img) arrive without e.error.
          if (e && e.target && e.target !== window && (e.target.src || e.target.href)) {
            handle('resource-error', 'Resource failed to load', e.target.src || e.target.href, '');
            return;
          }
          handle('window-onerror', (e && (e.message || (e.error && e.error.message))) || 'Error',
            e && e.filename, e && e.error && e.error.stack);
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          var msg = (reason && reason.message) || (reason ? String(reason) : 'Unhandled rejection');
          handle('unhandledrejection', msg, '', reason && reason.stack);
        });

        window.addEventListener('vite:preloadError', function (e) {
          var payload = e && e.payload;
          var msg = (payload && payload.message) || 'vite:preloadError';
          handle('vite:preloadError', msg, '', payload && payload.stack);
          // vite:preloadError is cancelable — prevent Vite's own throw so our
          // reload/fallback path is the single owner of the recovery.
          if (e && typeof e.preventDefault === 'function') e.preventDefault();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
